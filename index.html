<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 홈페이지 예제2</title>
    
    <style>
        /* reset Css */
        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        a{text-decoration: none; color: inherit;}

        /* 헤더영역 */
        header{
            width: 1100px;
            margin: 0 auto;
            height: 60px;
            line-height: 60px;

            display: flex;
            gap: 700px;
            justify-content: space-around;

            border-bottom: 1px solid rgb(113, 113, 113);
        }
        .gnb{
            display: flex;
            gap: 15px;

            font-size: clamp(14px, 2vw, 18px);
            color: gray;
        }
        .logo{
            font-size: clamp(18px, 2vw, 20px);
        }

        /* 메인 상단 섹션 */
        main{
            width: 1100px;
            margin: 0 auto;
            /* background-color: rgb(240, 233, 225); */
        }
        .visual{
            padding-top: 50px;
            
            display: flex;
            justify-content: center;
            gap: 100px;
        }

        .visual img{
            width: 500px;
            height: 300px;
            border-radius: 30px;
            object-fit: cover;
        }
        .visual ul>li{
            margin-top: 20px;
        }
        .visual ul>li h2{
            padding-top: 50px;
            font-size: clamp(40px,2vw,20px);
        }
        .visual li:nth-child(2){
            font-size: 18px;
            color: rgb(70, 69, 69);
        }
        .visual ul>li:nth-child(3){
            text-align: center;
            line-height: 40px;
            width: 100px;
            height:40px;

            color: #fff;
            background-color: sienna;
            border-radius: 5px;
        }


        /* 왜 우리인가 + 인기메뉴 공통 영역 */
        .us-section>ul,
        .best-menu>ul{
            display: flex;
            gap: 15px;
            padding: 0 15px;
        }

        .us-section h2,
        .best-menu h2{
            padding-left: 15px;
            padding-bottom: 20px;
            font-size: clamp(30px,2vw,20px);
        }

        .us-section li,
        .best-menu li{
            width: 350px;
            height: 200px;

            border-radius: 10px;
            background-size: cover;
            background-position: center;
        
            position: relative;
        }
        /* 우리인가 텍스트 */
        .us-section li p{
            width: 100%;
            height: 60px;

            text-align: center;
            line-height: 60px;

            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            background-color: #ffffff7a;
        }

        /* 우리인가 영역*/
        .us-section{
            margin-top: 80px;
        }

        .us-section li:nth-child(1){
            background-image: url(https://images.unsplash.com/photo-1518057111178-44a106bad636?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGNvZmZlZXxlbnwwfHwwfHx8Mg%3D%3D);
        }
        .us-section li:nth-child(2){
            background-image: url(https://images.unsplash.com/photo-1498804103079-a6351b050096?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fGNvZmZlZXxlbnwwfHwwfHx8Mg%3D%3D);
        }
        .us-section li:nth-child(3){
            background-image: url(https://images.unsplash.com/photo-1506372023823-741c83b836fe?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjJ8fGNvZmZlZXxlbnwwfHwwfHx8Mg%3D%3D);
        }

        /* 인기 메뉴 영역 */
        .best-menu{
            margin-top: 100px;
            padding-bottom: 80px;
        }
        .best-menu>ul{
            background-color: rgb(215, 196, 173);
        }

        .best-menu li:nth-child(1){
            background-image: url(https://images.unsplash.com/photo-1541167760496-1628856ab772?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8Y29mZmVlfGVufDB8fDB8fHwy);
        }
        .best-menu li:nth-child(2){
            background-image: url(https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Y29mZmVlfGVufDB8fDB8fHwy);
        }
        .best-menu li:nth-child(3){
            background-image: url(https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8Y29mZmVlfGVufDB8fDB8fHwy);
        }

        /* 인기 메뉴 텍스트 */
        .best-menu li p{
            width: 100px;
            height: 20px;

            text-align: center;

            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            border-radius: 5px;
        }

        /* 푸터영역 */
        footer{
            width: 1100px;
            height: 90px;
            margin: 0 auto;
            text-align: center;

            color: #fff;
            background-color: rgb(41, 41, 41);
        }
        footer>h3{
            padding-top: 15px;
            font-size: clamp(16px,2vw,18px);
        }
        footer>p{
            
            color: gray;
            font-size: clamp(12px,2vw,14px);
        }

        
        /* 반응형 */
        @media (max-width:768px) {
            header{
                width: 100%;
                gap: 0;
            }
            main{
                width: 100%;
            }
            .visual{
                display: block;
                text-align: center;
            }
            .visual img{
                width: 90%;
                height: 400px;
                margin: 5% auto 0;
            }
        .visual li:nth-child(2){
            font-size: 25px;
        }
            .visual li:nth-child(3){
                margin: 0 auto;
                margin-top: 5%;
            }

            /* 3칸 섹션들 세로나열 */
            .us-section>ul,
            .best-menu>ul{
                display: block;
            }

            /* 카드 비율 조절 */
            .us-section li,
            .best-menu li{
                width: 100%;
                height: 300px;
            }
            /* 상단 3칸 너비 조절 */
            .us-section li{
            margin-top: 10%;
            }

            /* 하단 3칸 너비 조절 */
            .best-menu li{
            margin-top: 5%;
            }
            .best-menu>ul{
                padding: 2%;
            }

            /* 글자 */
            .us-section li p{
                font-size: 19px;
                font-weight: bold;
            }
            /* 푸터 */
            footer{
                width: 100%;
            }
        }

        /* 모바일 사이즈 */
        @media (max-width:360px){
            header{
                width: 100%;
            }
            main{
                width: 100%;
            }
            footer{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h2 class="logo">BREW&CO</h2>
        <ul class="gnb">
            <li><a href="#">메뉴</a></li>
            <li><a href="#">소개</a></li>
            <li><a href="#">문의</a></li>
        </ul>
    </header>
    <main>
    <div class="main-inner">
            <div class="visual">
                <ul>
                    <li>
                        <h2>커피 한 잔의 여유</h2>
                    </li>
                    <li>
                        바쁜 도시의 흐름 속에서 <br> 
                        일상이 잠시 휴가처럼 느껴지는 순간,<br> 
                        도심 속 작은 쉼표를 전합니다,
                    </li>
                    <li>메뉴 보기</li>
                </ul>
                <p><img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="커피사진"></p>
            </div>
            <section class="us-section">
                <h2>왜 우리인가?</h2>
                <ul>
                    <li><p>스페셜티 원두</p></li>
                    <li><p>매일 베이커리</p></li>
                    <li><p>편안한 공간</p></li>
                </ul>
            </section>
            <section class="best-menu">
                <h2>인기 메뉴</h2>
                <ul>
                    <li><p>아메리카노</p></li>
                    <li><p>카페라떼</p></li>
                    <li><p>콜드브루</p></li>
                </ul>
            </section>
    </div>
    </main>
    <footer>
        <h3>BREW & CO</h3>
        <p>서울 마포구 연남동</p>
        <p>ⓒ 2026 All Rights Reserved</p>
    </footer>
</body>
</html>
